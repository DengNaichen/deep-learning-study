name: PencilNotes
options:
  bundleIdPrefix: study.prototype
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
targets:
  PencilNotes:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: study.prototype.PencilNotes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pencil Notes
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  PencilNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PencilNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PencilNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PencilNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PencilNotes:
    build:
      targets:
        PencilNotes: all
    test:
      targets:
        - PencilNotesTests
        - PencilNotesUITests
